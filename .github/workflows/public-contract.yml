name: Public contract tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out public trial
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Compile public Python sources
        run: python -m compileall -q run_trial.py tools tests

      - name: Run public contract and verifier tests
        run: python -m pytest -q
